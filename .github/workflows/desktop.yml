# Build the XYZ-OS desktop shell on every platform, smoke-test each package
# end to end (first-run extraction + engine boot + web UI), and publish the
# installers to a GitHub release when a desktop-v* tag is pushed.
name: Desktop

on:
  pull_request:
  push:
    branches: [master]
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bundles: nsis
            artifact: xyz-os-windows-x64
            files: desktop/src-tauri/target/release/bundle/nsis/*.exe
          - name: macos-arm64
            os: macos-14
            bundles: app,dmg
            artifact: xyz-os-macos-arm64
            files: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - name: linux-x64
            os: ubuntu-24.04
            bundles: deb,appimage
            artifact: xyz-os-linux-x64
            files: |
              desktop/src-tauri/target/release/bundle/deb/*.deb
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
    steps:
      # The repository ships CLAUDE.md as symlinks, one with a target too long
      # for a symlink on hosted runners and none of them creatable on Windows
      # without Developer Mode. Materialize them as regular files at checkout;
      # nothing in the desktop build reads them.
      - name: Check out without repository symlinks
        run: git config --global core.symlinks false

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2 xvfb

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            desktop/src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: desktop-${{ matrix.name }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install desktop tooling
        run: pnpm --ignore-workspace --dir desktop install --frozen-lockfile

      - name: Build libraries and web UI
        run: pnpm run build

      - name: Build desktop app
        run: cd desktop && node scripts/build.mjs --bundles ${{ matrix.bundles }}

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          XYZ_OS_PORT=43123 ./desktop/src-tauri/target/release/xyz-os &
          APP_PID=$!
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:43123/ >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:43123/ | grep -qi xyz
          kill "$APP_PID" || true
          pkill -f 'web --port 43123' || true

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          XYZ_OS_PORT=43123 xvfb-run -a ./desktop/src-tauri/target/release/xyz-os &
          APP_PID=$!
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:43123/ >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:43123/ | grep -qi xyz
          kill "$APP_PID" || true
          pkill -f 'web --port 43123' || true

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:XYZ_OS_PORT = '43123'
          $app = Start-Process -FilePath 'desktop\src-tauri\target\release\xyz-os.exe' -PassThru
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $response = Invoke-WebRequest 'http://127.0.0.1:43123/' -UseBasicParsing -TimeoutSec 3
              if ($response.StatusCode -eq 200) { break }
            } catch {}
            Start-Sleep -Seconds 2
          }
          $response = Invoke-WebRequest 'http://127.0.0.1:43123/' -UseBasicParsing -TimeoutSec 10
          if ($response.Content -notmatch 'XYZ') { throw 'web UI did not load' }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Get-Process xyz-engine -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" \
            --title "XYZ-OS Desktop $TAG" \
            --notes-file desktop/RELEASE_NOTES.md || true
          gh release upload "$TAG" ${{ matrix.files }} --clobber
