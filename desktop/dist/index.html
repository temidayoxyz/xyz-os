<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>XYZ-OS</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center;
      background: #101014; color: #eceef2;
      font: 14px system-ui, sans-serif;
    }
    .boot { text-align: center; opacity: 0.85; }
    .mark {
      width: 56px; height: 56px; margin: 0 auto 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, #4f7cff, #8b5cf6);
    }
    .note { margin-top: 8px; font-size: 12px; color: #8a8f98; }
  </style>
</head>
<body>
  <div class="boot">
    <div class="mark"></div>
    <div>Starting XYZ-OS&hellip;</div>
    <div class="note">Booting the local agent engine</div>
  </div>
</body>
</html>
