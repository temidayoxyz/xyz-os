[package]
name = "xyz-os"
version = "0.1.0"
description = "XYZ-OS desktop shell — a thin window around the local agent engine"
authors = ["Temidayo XYZ"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"
tar = "0.4"
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
junction = "0.2"
